services:
  - type: web
    name: researcher-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: researcher-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: researcher-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: researcher-backend
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
